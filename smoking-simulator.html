<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>抽烟模拟器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout language borrowed from kaltwrk/experiment-001: the scene is the page (full-bleed, black), the UI is a
     few quiet overlays — a light-grey panel, small text, a difference-blended credit line, a thin loading ring. */
  :root {
    --ui-font: "Inter Tight", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
    --chip-bg: hsla(230, 5%, 90%, 0.94);
    --chip-fg: hsla(230, 10%, 26%, 1);
    --chip-fg-dim: hsla(230, 10%, 30%, 0.4);
    --chip-hover: hsla(230, 15%, 30%, 0.1);
    --chip-active: hsla(230, 15%, 30%, 0.2);
    --chip-rule: hsla(230, 15%, 30%, 0.14);
    /* Tweakpane theme (same palette as the reference) */
    --tp-base-background-color: hsla(230, 5%, 90%, 1);
    --tp-base-shadow-color: hsla(0, 0%, 0%, 0.1);
    --tp-button-background-color: hsla(230, 7%, 75%, 1);
    --tp-button-background-color-active: hsla(230, 7%, 60%, 1);
    --tp-button-background-color-focus: hsla(230, 7%, 65%, 1);
    --tp-button-background-color-hover: hsla(230, 7%, 70%, 1);
    --tp-button-foreground-color: hsla(230, 10%, 30%, 1);
    --tp-container-background-color: hsla(230, 15%, 30%, 0.2);
    --tp-container-background-color-active: hsla(230, 15%, 30%, 0.32);
    --tp-container-background-color-focus: hsla(230, 15%, 30%, 0.28);
    --tp-container-background-color-hover: hsla(230, 15%, 30%, 0.24);
    --tp-container-foreground-color: hsla(230, 10%, 30%, 1);
    --tp-groove-foreground-color: hsla(230, 15%, 30%, 0.1);
    --tp-input-background-color: hsla(230, 15%, 30%, 0.1);
    --tp-input-background-color-active: hsla(230, 15%, 30%, 0.22);
    --tp-input-background-color-focus: hsla(230, 15%, 30%, 0.18);
    --tp-input-background-color-hover: hsla(230, 15%, 30%, 0.14);
    --tp-input-foreground-color: hsla(230, 10%, 30%, 1);
    --tp-label-foreground-color: hsla(230, 10%, 30%, 0.7);
    --tp-monitor-background-color: hsla(230, 15%, 30%, 0.1);
    --tp-monitor-foreground-color: hsla(230, 10%, 30%, 0.5);
    --tp-base-font-family: var(--ui-font);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; background: #000; color: #fff; overflow: hidden;
    font-family: var(--ui-font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  #sceneWrap { position: fixed; inset: 0; background: #000; touch-action: none; }
  #c { width: 100%; height: 100%; display: block; cursor: grab; }

  .brand {
    position: fixed; left: 16px; top: 14px; z-index: 30; pointer-events: none;
    color: #fff; mix-blend-mode: difference; display: flex; flex-direction: column; gap: 3px;
  }
  .brand b { font-size: 13px; font-weight: 500; letter-spacing: 0.01em; }
  .brand span { font-size: 11px; opacity: 0.55; }

  .flabel {
    position: absolute; transform: translate(-50%, -100%); pointer-events: none; white-space: nowrap;
    font-size: 11px; letter-spacing: 0.04em; color: rgba(255, 255, 255, 0.88); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.75);
  }
  .flabel.hint { transform: translate(0, -100%); opacity: 0; transition: opacity 0.15s; font-size: 12px; }
  .flabel::before {
    content: ""; display: inline-block; width: 5px; height: 5px; margin-right: 6px; border-radius: 50%;
    background: currentColor; vertical-align: 1px; opacity: 0.85;
  }
  #status {
    position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%); z-index: 20; pointer-events: none;
    font-size: 12px; letter-spacing: 0.03em; color: rgba(255, 255, 255, 0.86); white-space: nowrap;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.85);
  }
  #status.warn { color: #ffb27a; }

  .controls {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 30;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: stretch; gap: 2px; padding: 4px;
    max-width: calc(100vw - 24px); border-radius: 10px; background: var(--chip-bg);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  .controls .rule { width: 1px; margin: 7px 3px; background: var(--chip-rule); }
  button.act {
    appearance: none; border: 0; background: transparent; color: var(--chip-fg); cursor: pointer;
    font: 500 12.5px/1 var(--ui-font); padding: 9px 12px; border-radius: 7px; white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease; -webkit-user-select: none; user-select: none;
  }
  button.act:hover:not(:disabled) { background: var(--chip-hover); }
  button.act:active:not(:disabled) { background: var(--chip-active); }
  button.act:disabled { color: var(--chip-fg-dim); cursor: default; }
  button.act:focus-visible { outline: 2px solid hsla(230, 40%, 50%, 0.55); outline-offset: -2px; }
  button.act.on { color: hsla(230, 55%, 42%, 1); }

  .meta {
    position: fixed; right: 16px; bottom: 16px; z-index: 20; pointer-events: none; text-align: right;
    font-size: 11px; line-height: 1.55; color: #fff; mix-blend-mode: difference;
  }
  .meta .keys { opacity: 0.6; }
  #panel { position: fixed; top: 12px; right: 12px; z-index: 40; width: min(280px, calc(100vw - 24px)); }

  #loader {
    position: fixed; inset: 0; z-index: 60; background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px; transition: opacity 0.6s ease;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader .ring {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.15);
    border-top-color: rgba(255, 255, 255, 0.8); animation: spin 1s linear infinite;
  }
  #loader p { margin: 0; font-size: 13px; color: rgba(255, 255, 255, 0.6); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #loader .ring { animation-duration: 3s; } }

  #bubble {
    position: absolute; transform: translate(-50%, -100%); max-width: 70%; pointer-events: none; white-space: nowrap;
    font-size: 13px; color: #fff; background: rgba(20, 20, 26, 0.8); padding: 7px 12px; border-radius: 10px;
    opacity: 0; transition: opacity 0.25s ease;
  }
  #bubble.show { opacity: 1; }
  #hurt {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at 55% 75%, rgba(255, 40, 20, 0.5), rgba(255, 40, 20, 0.12) 45%, transparent 75%);
    transition: opacity 0.6s ease;
  }
  #hurt.on { opacity: 1; transition: opacity 0.06s ease; }
  #dreamLine {
    position: absolute; left: 50%; top: 18%; transform: translateX(-50%); pointer-events: none; white-space: nowrap;
    font-size: 15px; letter-spacing: 0.35em; color: #fbe6f2;
    text-shadow: 0 0 10px rgba(255, 160, 210, 0.8), 0 0 2px rgba(255, 255, 255, 0.6);
    opacity: 0; transition: opacity 1.8s ease; filter: blur(0.3px);
  }
  #dreamLine.show { opacity: 0.62; }
  .webgl-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, 0.6); font-size: 13px; text-align: center; padding: 20px; }
  @media (max-width: 720px) {
    .meta { display: none; }
    #status { bottom: 112px; }
    button.act { padding: 8px 9px; font-size: 12px; }
  }
</style>
</head>
<body>
<main id="sceneWrap">
  <canvas id="c"></canvas>
  <div id="hurt"></div>
  <div class="flabel" id="labelPack">还剩 20 支</div>
  <div class="flabel" id="labelTray">烟灰缸</div>
  <div class="flabel hint" id="labelHover"></div>
  <div id="bubble"></div>
  <div id="status">点桌上的东西就能用 · 拖动画面转头</div>
  <div id="dreamLine"></div>
</main>

<header class="brand"><b>抽烟模拟器</b><span>Smoking Simulator · Experiment</span></header>

<nav class="controls" aria-label="动作">
  <button class="act" id="btnTake" title="烟盒">抽一支</button>
  <span class="rule"></span>
  <button class="act" id="btnLight" hidden>点燃</button>
  <button class="act" id="btnPuff" hidden>按住吸</button>
  <button class="act" id="btnTap" disabled>弹烟灰</button>
  <span class="rule"></span>
  <button class="act" id="btnStub" disabled>摁灭</button>
  <button class="act" id="btnFloat">烟头漂浮</button>
  <span class="rule"></span>
  <button class="act" id="btnBetel">吃颗槟榔</button>
  <button class="act on" id="btnPhone">刷手机 开</button>
  <button class="act" id="btnWindow">开窗</button>
  <span class="rule"></span>
  <button class="act on" id="btnSound">声音 开</button>
  <button class="act" id="btnStyle">梦核</button>
  <span class="rule"></span>
  <button class="act" id="btnGirlOn">女孩 关</button>
  <span id="girlCtrl"><button class="act" id="btnGirl">递她一支烟</button></span>
</nav>

<footer class="meta"><div id="statsLine">今天已经抽了 0 支 · 一共吸了 0 口</div><div class="keys">点桌上的烟盒、火机、槟榔、手机也能操作 · 按住空格吸 · E 抽烟/点火 · F 弹烟灰 · X 摁灭 · B 槟榔 · P 手机 · O 开窗 · G 女孩</div></footer>

<div id="panel"></div>
<div id="loader" role="status" aria-live="polite"><div class="ring"></div><p>Loading…</p></div>
<script>
  // never leave the loading screen up if the scene fails to start
  addEventListener("error", function () { var l = document.getElementById("loader"); if (l) l.classList.add("done"); });
  setTimeout(function () { var l = document.getElementById("loader"); if (l) l.classList.add("done"); }, 20000);
</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
  "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js"
} }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { Pane } from "tweakpane";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

// the scene was lit and graded with raw (linear) colour values; keep hex colours as they are
THREE.ColorManagement.enabled = false;
// art direction: "dream" = low-res, vertex-snapped, dithered, pastel dreamcore (default); "real" = the photographic look
const STYLE = (function () {
  try { const q = new URLSearchParams(location.search).get("style"); return q || localStorage.getItem("smokesim-style") || "dream"; }
  catch (e) { return "dream"; }
})();
const LOFI = STYLE !== "real";
let LOFI_LINES = 240;                         // internal vertical resolution in dream mode
if (LOFI) {
  // PS1-style wobble: every vertex lands on a coarse screen grid, so edges jitter as the camera moves
  THREE.ShaderChunk.project_vertex +=
    "\n\t#ifndef USE_SKINNING\n" +          // the skinned hand is exempt: snapping melts its fingers
    "\n\tif ( gl_Position.w > 0.0 ) { vec2 snapGrid = vec2( 190.0, 108.0 );" +
    " gl_Position.xy = floor( gl_Position.xy / gl_Position.w * snapGrid + 0.5 ) / snapGrid * gl_Position.w; }\n" +
    "\n\t#endif\n";
}
// scanned-proportion hand (WebXR generic hand, MIT) — falls back to the built-in hand if it cannot load
// The hand model is low-poly (~1.4k vertices). Subdivide it (1 triangle -> 4, skin weights blended and trimmed
// to the 4 strongest bones), relax the result with Taubin smoothing so the silhouette rounds off without
// shrinking, and average normals across UV seams so the shading is continuous.
function smoothSkinnedGeometry(src, levels) {
  let g = src;
  if (!g.index) { g = src.clone(); g.setIndex(Array.from({ length: src.attributes.position.count }, function (_, i) { return i; })); }
  for (let lv = 0; lv < levels; lv++) {
    const P = g.attributes.position, N = g.attributes.normal, U = g.attributes.uv, SI = g.attributes.skinIndex, SW = g.attributes.skinWeight;
    const pos = [], uv = [], si = [], sw = [], idx = [];
    const n0 = P.count;
    for (let i = 0; i < n0; i++) {
      pos.push(P.getX(i), P.getY(i), P.getZ(i)); uv.push(U ? U.getX(i) : 0, U ? U.getY(i) : 0);
      si.push(SI.getX(i), SI.getY(i), SI.getZ(i), SI.getW(i)); sw.push(SW.getX(i), SW.getY(i), SW.getZ(i), SW.getW(i));
    }
    const mid = new Map();
    function midpoint(a, b) {
      const k = a < b ? a + "_" + b : b + "_" + a;
      if (mid.has(k)) return mid.get(k);
      const id = pos.length / 3;
      for (let c = 0; c < 3; c++) pos.push((pos[a * 3 + c] + pos[b * 3 + c]) / 2);
      for (let c = 0; c < 2; c++) uv.push((uv[a * 2 + c] + uv[b * 2 + c]) / 2);
      const wmap = {};
      [a, b].forEach(function (v) { for (let c = 0; c < 4; c++) { const w = sw[v * 4 + c] * 0.5; if (w > 0) wmap[si[v * 4 + c]] = (wmap[si[v * 4 + c]] || 0) + w; } });
      const top = Object.keys(wmap).map(function (k2) { return [+k2, wmap[k2]]; }).sort(function (x, y) { return y[1] - x[1]; }).slice(0, 4);
      const tot = top.reduce(function (t, e) { return t + e[1]; }, 0) || 1;
      for (let c = 0; c < 4; c++) { si.push(top[c] ? top[c][0] : 0); sw.push(top[c] ? top[c][1] / tot : 0); }
      mid.set(k, id);
      return id;
    }
    const I = g.index;
    for (let t = 0; t < I.count; t += 3) {
      const a = I.getX(t), b = I.getX(t + 1), c = I.getX(t + 2);
      const ab = midpoint(a, b), bc = midpoint(b, c), ca = midpoint(c, a);
      idx.push(a, ab, ca, b, bc, ab, c, ca, bc, ab, bc, ca);
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    out.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
    out.setAttribute("skinIndex", new THREE.Uint16BufferAttribute(si, 4));
    out.setAttribute("skinWeight", new THREE.Float32BufferAttribute(sw, 4));
    out.setIndex(idx);
    g = out;
  }
  // weld by position (UV seams split vertices), then Taubin-relax the welded surface
  const P = g.attributes.position, n = P.count, key = new Array(n), groups = new Map();
  for (let i = 0; i < n; i++) {
    const k = Math.round(P.getX(i) * 1e5) + "," + Math.round(P.getY(i) * 1e5) + "," + Math.round(P.getZ(i) * 1e5);
    key[i] = k; if (!groups.has(k)) groups.set(k, groups.size);
  }
  const gid = key.map(function (k) { return groups.get(k); }), G = groups.size;
  const gp = new Float32Array(G * 3);
  for (let i = 0; i < n; i++) { gp[gid[i] * 3] = P.getX(i); gp[gid[i] * 3 + 1] = P.getY(i); gp[gid[i] * 3 + 2] = P.getZ(i); }
  const nbr = Array.from({ length: G }, function () { return new Set(); });
  const I = g.index;
  for (let t = 0; t < I.count; t += 3) {
    const a = gid[I.getX(t)], b = gid[I.getX(t + 1)], c = gid[I.getX(t + 2)];
    nbr[a].add(b); nbr[a].add(c); nbr[b].add(a); nbr[b].add(c); nbr[c].add(a); nbr[c].add(b);
  }
  function relax(f) {
    const nx = new Float32Array(gp.length);
    for (let v = 0; v < G; v++) {
      let sx = 0, sy = 0, sz = 0, m = 0;
      nbr[v].forEach(function (u) { sx += gp[u * 3]; sy += gp[u * 3 + 1]; sz += gp[u * 3 + 2]; m++; });
      for (let c = 0; c < 3; c++) nx[v * 3 + c] = gp[v * 3 + c] + (m ? f * ((c === 0 ? sx : c === 1 ? sy : sz) / m - gp[v * 3 + c]) : 0);
    }
    gp.set(nx);
  }
  for (let it = 0; it < 2; it++) { relax(0.5); relax(-0.53); }
  for (let i = 0; i < n; i++) P.setXYZ(i, gp[gid[i] * 3], gp[gid[i] * 3 + 1], gp[gid[i] * 3 + 2]);
  g.computeVertexNormals();
  const N = g.attributes.normal, acc = new Float32Array(G * 3);
  for (let i = 0; i < n; i++) { acc[gid[i] * 3] += N.getX(i); acc[gid[i] * 3 + 1] += N.getY(i); acc[gid[i] * 3 + 2] += N.getZ(i); }
  for (let i = 0; i < n; i++) {
    const x = acc[gid[i] * 3], y = acc[gid[i] * 3 + 1], z = acc[gid[i] * 3 + 2], l = Math.hypot(x, y, z) || 1;
    N.setXYZ(i, x / l, y / l, z / l);
  }
  return g;
}

// Hand model refinement, done once in the model's bind pose (glTF scene at identity, units = metres):
//   1. slim the fingers ~10% towards their bone axes (the stock mesh reads as sausages up close)
//   2. vertex colour: paler pink palm, slightly darker back of hand, thin flexion creases on the palm side of
//      each finger joint, reddened knuckles on the back, pink fingertips
//   3. fingernails: thin curved plates sitting on the back of each distal segment, parented to that bone
const FINGER_CHAINS = [
  ["index-finger-phalanx-proximal", "index-finger-phalanx-intermediate", "index-finger-phalanx-distal", "index-finger-tip"],
  ["middle-finger-phalanx-proximal", "middle-finger-phalanx-intermediate", "middle-finger-phalanx-distal", "middle-finger-tip"],
  ["ring-finger-phalanx-proximal", "ring-finger-phalanx-intermediate", "ring-finger-phalanx-distal", "ring-finger-tip"],
  ["pinky-finger-phalanx-proximal", "pinky-finger-phalanx-intermediate", "pinky-finger-phalanx-distal", "pinky-finger-tip"],
  ["thumb-phalanx-proximal", "thumb-phalanx-distal", "thumb-tip"]
];
function handFrame(scene) {
  const wp = function (n) { return scene.getObjectByName(n).getWorldPosition(new THREE.Vector3()); };
  const W = wp("wrist"), y = wp("middle-finger-phalanx-proximal").sub(W).normalize();
  const x = wp("pinky-finger-phalanx-proximal").sub(wp("index-finger-phalanx-proximal"));
  x.sub(y.clone().multiplyScalar(x.dot(y))).normalize();
  return { wp: wp, dorsal: new THREE.Vector3().crossVectors(x, y), side: x };
}
function slimFingers(scene, amount) {
  scene.updateMatrixWorld(true);
  const F = handFrame(scene);
  scene.traverse(function (mesh) {
    if (!mesh.isSkinnedMesh) return;
    const bones = mesh.skeleton.bones, seg = {};
    FINGER_CHAINS.forEach(function (ch) {
      for (let i = 0; i < ch.length - 1; i++) {
        const bi = bones.findIndex(function (b) { return b.name === ch[i]; });
        if (bi >= 0) seg[bi] = [F.wp(ch[i]), F.wp(ch[i + 1])];
      }
    });
    const g = mesh.geometry, P = g.attributes.position, SI = g.attributes.skinIndex, SW = g.attributes.skinWeight;
    const m = mesh.matrixWorld, mi = m.clone().invert(), v = new THREE.Vector3(), ab = new THREE.Vector3(), c = new THREE.Vector3();
    for (let i = 0; i < P.count; i++) {
      let best = -1, bw = 0;
      for (let k = 0; k < 4; k++) { const w = SW.getComponent(i, k); if (w > bw) { bw = w; best = SI.getComponent(i, k); } }
      const sgm = seg[best];
      if (!sgm) continue;
      v.fromBufferAttribute(P, i).applyMatrix4(m);
      ab.subVectors(sgm[1], sgm[0]);
      const t = THREE.MathUtils.clamp(c.subVectors(v, sgm[0]).dot(ab) / ab.lengthSq(), 0, 1);
      c.copy(sgm[0]).addScaledVector(ab, t);
      v.lerp(c, amount * bw).applyMatrix4(mi);
      P.setXYZ(i, v.x, v.y, v.z);
    }
    P.needsUpdate = true;
  });
}
function paintAndNail(scene) {
  scene.updateMatrixWorld(true);
  const F = handFrame(scene);
  scene.traverse(function (mesh) {
    if (!mesh.isSkinnedMesh) return;
    const g = mesh.geometry, P = g.attributes.position, N = g.attributes.normal, n = P.count;
    const m = mesh.matrixWorld, v = new THREE.Vector3(), nn = new THREE.Vector3(), d = new THREE.Vector3();
    // joints along every finger with the direction the finger continues in
    const joints = [];
    FINGER_CHAINS.forEach(function (ch) {
      for (let i = 1; i < ch.length; i++) {
        const p = F.wp(ch[i]), prev = F.wp(ch[i - 1]);
        joints.push({ p: p, dir: p.clone().sub(prev).normalize(), tip: i === ch.length - 1, knuckle: i === 1 });
      }
      const p0 = F.wp(ch[0]), p1 = F.wp(ch[1]);
      joints.push({ p: p0, dir: p1.clone().sub(p0).normalize(), tip: false, knuckle: true, mcp: true });
    });
    const col = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      v.fromBufferAttribute(P, i).applyMatrix4(m);
      nn.fromBufferAttribute(N, i).transformDirection(m);
      const back = nn.dot(F.dorsal);                                        // +1 back of hand, -1 palm
      let r = 1, gg = 1, b = 1;
      const pb = THREE.MathUtils.smoothstep(back, -0.6, 0.4);               // 0 palm .. 1 back
      r *= 1.03 - 0.04 * pb; gg *= 0.99 - 0.05 * pb; b *= 0.97 - 0.05 * pb;
      for (let j = 0; j < joints.length; j++) {
        const J = joints[j];
        d.subVectors(v, J.p);
        const axial = d.dot(J.dir), radial = Math.sqrt(Math.max(0, d.lengthSq() - axial * axial));
        if (radial > 0.016) continue;

  function updateChew(t, dt) {
    var k = 0;
    if (chew.on) {
      var e = t - chew.t0;
      if (e > chew.dur) { chew.on = false; renderUI(); }
      else {
        k = Math.min(1, e / 5) * Math.min(1, (chew.dur - e) / 8);
        camera.position.y += Math.pow(Math.sin(e * Math.PI * 1.55), 2) * 0.006 * (e < chew.dur * 0.6 ? 1 : 0.5);   // the jaw
        if (e < chew.dur * 0.55 && t > chew.nextCrunch) { sfx.chew(0.6); chew.nextCrunch = t + rand(0.55, 0.85); }
        if (k > 0.25 && t > chew.nextBeat) { sfx.heart(0.4 + 0.6 * k); chew.beatT = t; chew.nextBeat = t + 60 / (76 + 30 * k); }
        if (Math.floor(e) !== chew.shown) { chew.shown = Math.floor(e); renderUI(); }
      }
    }
    pace += ((1 + 0.5 * k) - pace) * Math.min(1, dt * 2);
    burnPace = 1 + (pace - 1) * 2;
    var sb = t - chew.beatT, env = Math.exp(-sb * 10) + (sb > 0.2 ? 0.6 * Math.exp(-(sb - 0.2) * 10) : 0);
    compMat.uniforms.flush.value += (0.6 * k - compMat.uniforms.flush.value) * Math.min(1, dt);
    compMat.uniforms.beat.value = env * k;
  }

  });

      else { M.tray.color.set(tray0.color); M.tray.metalness = tray0.metal; M.tray.roughness = tray0.rough; }
      save();
    }
    if (!(M.tray instanceof THREE.MeshPhysicalMaterial)) {                     // tray needs the physical model for the film
      var tp = new THREE.MeshPhysicalMaterial();
      THREE.MeshStandardMaterial.prototype.copy.call(tp, M.tray);
      tp.defines = { STANDARD: "", PHYSICAL: "" };                        // the standard copy() drops the PHYSICAL define
      tp.iridescenceIOR = 1.3; tp.iridescenceThicknessRange = [160, 720];
      scene.traverse(function (o) { if (o.material === M.tray) o.material = tp; });
      M.tray = tp;
    }
    var trayFilmSync = function () { M.tray.iridescence = look.trayFilm ? look.film : 0; M.tray.clearcoat = look.trayFilm ? look.coat : 0; };
    var pane = new Pane({ container: host, title: "画面", expanded: false });
    var on = function (b) { b.on("change", function () { apply(); trayFilmSync(); }); };
    pane.addBinding(look, "style", { label: "画风", options: { "梦核": "dream", "写实": "real" } }).on("change", function (ev) {
      try { localStorage.setItem("smokesim-style", ev.value); } catch (e) {}
      location.href = location.pathname + "?style=" + ev.value;
    });
    var fTone = pane.addFolder({ title: "曝光 / 泛光", expanded: true });
    on(fTone.addBinding(look, "exposure", { label: "曝光", min: 0.4, max: 2.2, step: 0.01 }));
    on(fTone.addBinding(look, "bloom", { label: "泛光", min: 0, max: 3, step: 0.01 }));
    on(fTone.addBinding(look, "threshold", { label: "泛光阈值", min: 0.1, max: 2, step: 0.01 }));
    var fLens = pane.addFolder({ title: "镜头", expanded: true });
    on(fLens.addBinding(look, "ao", { label: "接触阴影", min: 0, max: 1, step: 0.01 }));
    on(fLens.addBinding(look, "aperture", { label: "景深", min: 0, max: 1, step: 0.01 }));
    on(fLens.addBinding(look, "vignette", { label: "暗角", min: 0, max: 0.9, step: 0.01 }));
    on(fLens.addBinding(look, "grain", { label: "颗粒", min: 0, max: 3, step: 0.01 }));
    if (LOFI) {
      var fPix = pane.addFolder({ title: "像素", expanded: false });
      on(fPix.addBinding(look, "lines", { label: "行数", min: 120, max: 720, step: 10 }));
      on(fPix.addBinding(look, "levels", { label: "色阶", min: 4, max: 64, step: 1 }));
    }
    var fFilm = pane.addFolder({ title: "薄膜干涉材质", expanded: false });
    on(fFilm.addBinding(look, "film", { label: "强度", min: 0, max: 1, step: 0.01 }));
    on(fFilm.addBinding(look, "filmIOR", { label: "IOR", min: 1, max: 2.33, step: 0.01 }));
    on(fFilm.addBinding(look, "thin", { label: "膜厚 薄", min: 0, max: 1200, step: 1 }));
    on(fFilm.addBinding(look, "thick", { label: "膜厚 厚", min: 0, max: 1200, step: 1 }));
    on(fFilm.addBinding(look, "coat", { label: "清漆", min: 0, max: 1, step: 0.01 }));
    on(fFilm.addBinding(look, "facets", { label: "切面" }));
    on(fFilm.addBinding(look, "trayFilm", { label: "烟灰缸也用" }));
    pane.addButton({ title: "恢复默认" }).on("click", function () {
      try { localStorage.removeItem("smokesim-look"); } catch (e) {}
      location.reload();
    });
    apply(); trayFilmSync();
  })();

  animate();
  // hand the screen over once the first frames are on it
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    var l = document.getElementById("loader"); if (l) l.classList.add("done");
  }); });
})();
</script>
</body>
</html>
