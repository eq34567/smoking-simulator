; Merge into Config/DefaultEngine.ini, then restart the editor (shaders will recompile).
; Hardware ray tracing needs DX12 (Windows) and an RTX / RX 6000+ class GPU.

[/Script/Engine.RendererSettings]
; Lumen global illumination + reflections
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=True
r.Lumen.TraceMeshSDFs=1
r.GenerateMeshDistanceFields=True
; ray tracing support (for Lumen HWRT and translucent glass reflections)
r.RayTracing=True
r.SkinCache.CompileShaders=True
; Virtual Shadow Maps for the tiny contact shadows around fingers / cigarette
r.Shadow.Virtual.Enable=1
; Temporal Super Resolution anti-aliasing
r.AntiAliasingMethod=4
; exposure is set manually in the post process volume
r.DefaultFeature.AutoExposure=False
; high quality translucency lighting for smoke
r.TranslucencyLightingVolumeDim=64
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=128
; Heterogeneous volumes (optional, for volumetric exhale later — UE 5.3+)
r.HeterogeneousVolumes=1

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
